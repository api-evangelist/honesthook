  /api/v1/youtube/videos/trending:
    get:
      operationId: youtubeVideosTrending
      summary: The videos trending in one region, from the official Data API v3 (videos.list…
      description: 'The videos trending in one region, from the official Data API v3 (videos.list with chart=mostPopular, 1 quota unit) -- up to 50, in chart order, with exact view, like and comment counts. The region parameter is REQUIRED on purpose: trending does not exist without a region, and a silent default would publish one country''s chart as if it were the world''s. There is no author -- the list belongs to a region, not to an account, so the twelve author fields are null by decision. has_more is null, never false. The category is not returned: snippet carries a numeric categoryId whose meaning needs another call we do not make, and serving the raw number would serve a code the client cannot resolve.'
      x-creditos: 1
      parameters:
      - name: region
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Data found.
        '400':
          description: See the shared error shape.
        '401':
          description: See the shared error shape.
        '402':
          description: See the shared error shape.
        '404':
          description: See the shared error shape.
        '405':
          description: See the shared error shape.
        '451':
          description: See the shared error shape.
        '502':
          description: See the shared error shape.
        '503':
