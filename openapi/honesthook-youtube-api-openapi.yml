  /api/v1/youtube/profile/full:
    get:
      operationId: youtubeProfileFull
      summary: One YouTube channel plus its recent videos in a single answer, from the…
      description: 'One YouTube channel plus its recent videos in a single answer, from the official Data API v3 (channels.list + playlistItems.list + videos.list, 3 quota units) -- the channel in author with exact subscriber, video and view counts, and the recent uploads as items with exact view, like and comment counts. NO COMPUTED ANALYTICS ARE RETURNED: no average views per video, no engagement rate, no upload cadence, no growth. It is a COMPOSITION of calls the client could make separately, saved as one request; every number in it is a number the source states. It does NOT use search.list. One page of recent uploads -- limit is NOT accepted and has_more is null, never false.'
      x-creditos: 1
      parameters:
      - name: channel_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Data found.
        '400':
          description: See the shared error shape.
        '401':
          description: See the shared error shape.
        '402':
          description: See the shared error shape.
        '404':
          description: See the shared error shape.
